  <style>
    .flicker { animation: flicker 3s infinite; }
    @keyframes flicker { 0%,19%,21%,23%,55%,57%,100% { opacity: 1 } 20%,22%,56% { opacity: .45 } }
    .pulse { animation: pulse 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
    .grid { animation: grid 2.4s linear infinite; }
    @keyframes grid { from { transform: translateY(0) } to { transform: translateY(24px) } }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-320px) } to { transform: translateY(320px) } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .type { animation: type 7s steps(36) infinite; }
    @keyframes type { 0% { width: 0 } 45%,85% { width: 340px } 100% { width: 0 } }
    .cm { animation: cm 7s steps(36) infinite; }
    @keyframes cm { 0% { transform: translateX(0) } 45%,85% { transform: translateX(334px) } 100% { transform: translateX(0) } }
    @media (prefers-reduced-motion: reduce) { .flicker, .pulse, .grid, .scan, .caret { animation: none } .type { animation: none; width: 340px } .cm { animation: none; transform: translateX(334px) } }
  </style>
